name: Node.js CI

on:
  push:
    branches:
      - npmtest
  pull_request:
    branches:
      - npmtest
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: CDCA-C5ISR-Summit-Code-a-Thon-2013/shared-actions/.github/actions/npmbuild@v1
      - run: npm test
    
    






