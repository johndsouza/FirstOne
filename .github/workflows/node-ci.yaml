name: Node.js CI

on:
  push:
    branches:
      - npmtest
  pull_request:
    branches:
      - npmtest
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: johndsouza/shared-actions/.github/actions/npmbuild@v1
      - run: npm test

    
      - name: Download math result for job 2
        uses: actions/download-artifact@v5
        with:
          name: homework_final

      - name: Display structure of downloaded files
        run: ls -R
    
    






