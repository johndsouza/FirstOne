name: Node.js CI

on:
  push:
    branches:
      - npmtest
  pull_request:
    branches:
      - npmtest
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: johndsouza/shared-actions/.github/actions/npmbuild@v1
      - run: npm test

    
      - uses: actions/download-artifact@v8
        with:
        name: my-artifact

      - name: Display structure of downloaded files
        run: ls -R
    
    






