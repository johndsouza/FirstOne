name: Release build

on:
  workflow_run:
    workflows: ["Node.js CI"]
    types: [completed]
  
  workflow_dispatch:

  
jobs:
  deploy-dev:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "deploy to Dev" 
      
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 #v7.0
        with:
          name: my-artifact
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}\my-artifact
      
  deploy-test:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: test
    steps:
      - run: echo "deploy to Test" 
    






